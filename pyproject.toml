[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Trees-and-their-degrees"
version = "0.1.0"
description = "Trees and their degrees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["mathmodels", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
