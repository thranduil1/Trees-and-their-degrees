[project]
name = "mathmodels"
version = "0.1.0"
description = "Trees and their degrees"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [ 
    "numpy>=1.26",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "ruff"
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
